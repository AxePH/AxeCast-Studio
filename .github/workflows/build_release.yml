name: Build & Release AxeCast Studio

# ============================================================
# Triggers:
#   1. Push to main branch or version tags (v*)
#   2. Manual trigger from GitHub Actions UI (workflow_dispatch)
# ============================================================
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - macos
          - windows
          - linux
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  APP_NAME: AxeCast-Studio

jobs:
  # ──────────────────────────────────────────────
  # Build on Windows
  # ──────────────────────────────────────────────
  build-windows:
    name: "🪟 Build Windows"
    runs-on: windows-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows')) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[windows]') ||
        (!contains(github.event.head_commit.message, '[macos]') && !contains(github.event.head_commit.message, '[linux]'))
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        run: |
          pyinstaller `
            --noconfirm `
            --windowed `
            --name "AxeCast-Studio" `
            --icon "assets/icon.ico" `
            --add-data "assets;assets" `
            --add-data "bin;bin" `
            --add-data "axecast_stream.apk;." `
            --collect-all customtkinter `
            --collect-all tkinterdnd2 `
            --collect-all windnd `
            --collect-all websockets `
            --distpath release `
            app.py

      - name: Package Windows release
        run: |
          Copy-Item README.md release\AxeCast-Studio\
          Copy-Item axecast_stream.apk release\AxeCast-Studio\
          Compress-Archive -Path release\AxeCast-Studio -DestinationPath release\AxeCast-Studio-Windows-x64.zip -Force

      - name: Upload Windows archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-Windows-x64-zip
          path: release/AxeCast-Studio-Windows-x64.zip

  # ──────────────────────────────────────────────
  # Build on macOS
  # ──────────────────────────────────────────────
  build-macos:
    name: "🍎 Build macOS"
    runs-on: macos-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos')) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[macos]') ||
        (!contains(github.event.head_commit.message, '[windows]') && !contains(github.event.head_commit.message, '[linux]'))
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate macOS ICNS icon
        run: |
          mkdir -p assets/AppIcon.iconset
          sips -z 16 16     assets/icon.png --out assets/AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out assets/AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out assets/AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out assets/AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out assets/AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out assets/AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out assets/AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out assets/AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out assets/AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out assets/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/AppIcon.iconset -o assets/icon.icns
          # Clean up temporary iconset to prevent codesign subcomponent failure
          rm -rf assets/AppIcon.iconset

      - name: Build with PyInstaller (macOS)
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name "AxeCast-Studio" \
            --icon "assets/icon.icns" \
            --add-data "assets:assets" \
            --add-data "axecast_stream.apk:." \
            --collect-all customtkinter \
            --collect-all tkinterdnd2 \
            --collect-all websockets \
            --distpath release \
            app.py

      - name: Package & Sign macOS release
        run: |
          # Apply ad-hoc codesign for macOS Apple Silicon / Intel
          codesign --force --deep --sign - release/AxeCast-Studio.app

          mkdir -p release/AxeCast-Studio-macOS
          cp -R release/AxeCast-Studio.app release/AxeCast-Studio-macOS/
          cp README.md release/AxeCast-Studio-macOS/
          cp axecast_stream.apk release/AxeCast-Studio-macOS/

          # Package directly on macOS runner to preserve full POSIX executable permissions
          tar -czf release/AxeCast-Studio-macOS-arm64.tar.gz -C release/AxeCast-Studio-macOS .
          ditto -c -k --keepParent release/AxeCast-Studio-macOS release/AxeCast-Studio-macOS-arm64.zip

      - name: Upload macOS tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-macOS-arm64-tar
          path: release/AxeCast-Studio-macOS-arm64.tar.gz

      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-macOS-arm64-zip
          path: release/AxeCast-Studio-macOS-arm64.zip

  # ──────────────────────────────────────────────
  # Build on Linux
  # ──────────────────────────────────────────────
  build-linux:
    name: "🐧 Build Linux"
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux')) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[linux]') ||
        (!contains(github.event.head_commit.message, '[windows]') && !contains(github.event.head_commit.message, '[macos]'))
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        run: |
          pyinstaller \
            --noconfirm \
            --name "AxeCast-Studio" \
            --add-data "assets:assets" \
            --add-data "axecast_stream.apk:." \
            --collect-all customtkinter \
            --collect-all tkinterdnd2 \
            --collect-all websockets \
            --distpath release \
            app.py

      - name: Package Linux release
        run: |
          cp README.md release/AxeCast-Studio/
          cp axecast_stream.apk release/AxeCast-Studio/
          cp run.sh release/AxeCast-Studio/
          chmod +x release/AxeCast-Studio/AxeCast-Studio
          chmod +x release/AxeCast-Studio/run.sh
          tar -czf release/AxeCast-Studio-Linux-x64.tar.gz -C release/AxeCast-Studio .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-Linux-x64-tar
          path: release/AxeCast-Studio-Linux-x64.tar.gz

  # ──────────────────────────────────────────────
  # Publish GitHub Release (all 3 platforms)
  # ──────────────────────────────────────────────
  release:
    name: "📦 Publish Release"
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AxeCast-Studio-Windows-x64-zip
          path: release-files

      - name: Download macOS tar artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AxeCast-Studio-macOS-arm64-tar
          path: release-files

      - name: Download macOS zip artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AxeCast-Studio-macOS-arm64-zip
          path: release-files

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AxeCast-Studio-Linux-x64-tar
          path: release-files

      - name: Prepare Versioned Mobile Artifacts
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}"
          mkdir -p release-files
          if [ -f "axecast_stream.apk" ]; then
            cp axecast_stream.apk "release-files/AxeCast-Stream-${TAG}.apk"
          fi
          if compgen -G "build/*.ipa" > /dev/null; then
            for f in build/*.ipa; do
              cp "$f" "release-files/AxeCast-Stream-${TAG}.ipa"
            done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}
          name: "AxeCast Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}"
          body: |
            ## 🪓 AxeCast Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}

            ### 📥 Downloads

            | Platform | File | How to Use |
            |----------|------|------------|
            | 🪟 **Windows** (x64) | `AxeCast-Studio-Windows-x64.zip` | Extract and run `AxeCast-Studio.exe` |
            | 🍎 **macOS** (ARM64) | `AxeCast-Studio-macOS-arm64.zip` / `.tar.gz` | Extract and open `AxeCast-Studio.app` |
            | 🐧 **Linux** (x64) | `AxeCast-Studio-Linux-x64.tar.gz` | Extract and run `./run.sh` |
            | 🤖 **Android APK** | `AxeCast-Stream-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}.apk` | Companion app for wireless & remote streaming |
            | 🍏 **iOS IPA** | `AxeCast-Stream-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}.ipa` | iOS Companion app for iPhone / iPad streaming |

            ### 🌟 Key Features
            - **🌐 In-House Remote Room & Live Log Streamer** (6-Digit Room Code, 1-to-Many Broadcasting)
            - **60 FPS Hardware-Accelerated Mirroring** with multi-device controls
            - **AxeSQL Studio 🪓** native SQLite database manager
            - **Live Performance Dashboard** (CPU, GPU, RAM rolling Canvas charts)
            - **Simultaneous Multi-Drawer Panels** (File Explorer + Performance Graphs)
            - **Android Emulator Auto-Discovery** (LDPlayer, BlueStacks, Nox, MEmu, WSA)
            - **Smart GitHub Auto-Update Checker**
            - **Native Packaged Binaries** with self-contained dependencies

            > **🍎 Note for macOS Users:**
            > If macOS Gatekeeper shows a security warning on first launch (*"Apple could not verify..."*):
            > - Right-click `AxeCast-Studio.app` -> select **Open** -> click **Open**
            > - Or open Terminal and run: `xattr -cr AxeCast-Studio.app`

          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

