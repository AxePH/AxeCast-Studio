name: Build & Release AxeCast Studio

# ============================================================
# Triggers:
#   1. Push to main branch or version tags (v*)
#   2. Manual trigger from GitHub Actions UI (workflow_dispatch)
# ============================================================
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - macos
          - windows
          - linux
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  APP_NAME: AxeCast-Studio

jobs:
  # ──────────────────────────────────────────────
  # Build on Windows
  # ──────────────────────────────────────────────
  build-windows:
    name: "🪟 Build Windows"
    runs-on: windows-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows')) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[windows]') ||
        (!contains(github.event.head_commit.message, '[macos]') && !contains(github.event.head_commit.message, '[linux]'))
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build with Nuitka (Windows)
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --windows-disable-console
          --enable-plugin=tk-inter
          --include-package-data=customtkinter
          --include-data-dir=bin=bin
          --include-data-dir=assets=assets
          --include-data-files=axecast_stream.apk=axecast_stream.apk
          --windows-icon-from-ico=assets/icon.ico
          --output-dir=release
          app.py

      - name: Package Windows release
        run: |
          powershell -Command "
            Rename-Item -Path 'release\app.dist' -NewName 'AxeCast-Studio'
            Copy-Item -Path 'README.md' -Destination 'release\AxeCast-Studio\'
            Copy-Item -Path 'axecast_stream.apk' -Destination 'release\AxeCast-Studio\'
          "

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-Windows-x64
          path: release/AxeCast-Studio/

  # ──────────────────────────────────────────────
  # Build on macOS
  # ──────────────────────────────────────────────
  build-macos:
    name: "🍎 Build macOS"
    runs-on: macos-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos')) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[macos]') ||
        (!contains(github.event.head_commit.message, '[windows]') && !contains(github.event.head_commit.message, '[linux]'))
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tcl/Tk system dependencies
        run: |
          brew install tcl-tk@8 python-tk@3.11
          echo "TCL_ROOT=$(brew --prefix tcl-tk@8)" >> $GITHUB_ENV
          echo "$(brew --prefix tcl-tk@8)/bin" >> $GITHUB_PATH

      - name: Verify tkinter
        run: |
          python -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Generate macOS ICNS icon
        run: |
          mkdir -p assets/AppIcon.iconset
          sips -z 16 16     assets/icon.png --out assets/AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out assets/AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out assets/AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out assets/AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out assets/AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out assets/AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out assets/AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out assets/AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out assets/AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out assets/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/AppIcon.iconset -o assets/icon.icns

      - name: Build with Nuitka (macOS)
        env:
          TCL_LIBRARY: ${{ env.TCL_ROOT }}/lib/tcl8.6
          TK_LIBRARY: ${{ env.TCL_ROOT }}/lib/tk8.6
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --macos-create-app-bundle
          --macos-app-name=AxeCast-Studio
          --macos-app-icon=assets/icon.icns
          --enable-plugin=tk-inter
          --include-package-data=customtkinter
          --include-data-dir=assets=assets
          --include-data-files=axecast_stream.apk=axecast_stream.apk
          --output-dir=release
          app.py

      - name: Package macOS release
        run: |
          mkdir -p release/AxeCast-Studio-macOS
          # Rename app.app to AxeCast-Studio.app if needed
          if [ -d "release/app.app" ]; then
            mv release/app.app release/AxeCast-Studio.app
          fi
          # Ensure executable permissions on all binaries inside the app bundle
          chmod -R +x release/AxeCast-Studio.app/Contents/MacOS/ 2>/dev/null || true
          # Apply ad-hoc codesign for macOS ARM64 security requirements
          codesign --force --deep --sign - release/AxeCast-Studio.app 2>/dev/null || true

          cp -R release/AxeCast-Studio.app release/AxeCast-Studio-macOS/
          cp README.md release/AxeCast-Studio-macOS/
          cp axecast_stream.apk release/AxeCast-Studio-macOS/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-macOS-arm64
          path: release/AxeCast-Studio-macOS/

  # ──────────────────────────────────────────────
  # Build on Linux
  # ──────────────────────────────────────────────
  build-linux:
    name: "🐧 Build Linux"
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux')) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[linux]') ||
        (!contains(github.event.head_commit.message, '[windows]') && !contains(github.event.head_commit.message, '[macos]'))
      ))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk patchelf

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build with Nuitka (Linux)
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --include-package-data=customtkinter
          --include-data-dir=assets=assets
          --include-data-files=axecast_stream.apk=axecast_stream.apk
          --linux-icon=assets/icon.png
          --output-dir=release
          app.py

      - name: Package Linux release
        run: |
          mv release/app.dist release/AxeCast-Studio
          cp README.md release/AxeCast-Studio/
          cp axecast_stream.apk release/AxeCast-Studio/
          cp run.sh release/AxeCast-Studio/
          chmod +x release/AxeCast-Studio/app.bin 2>/dev/null || chmod +x release/AxeCast-Studio/app 2>/dev/null || true
          chmod +x release/AxeCast-Studio/run.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxeCast-Studio-Linux-x64
          path: release/AxeCast-Studio/

  # ──────────────────────────────────────────────
  # Publish GitHub Release (all 3 platforms)
  # ──────────────────────────────────────────────
  release:
    name: "📦 Publish Release"
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          cd artifacts
          [ -d "AxeCast-Studio-Windows-x64" ] && zip -r AxeCast-Studio-Windows-x64.zip AxeCast-Studio-Windows-x64/ || true
          [ -d "AxeCast-Studio-macOS-arm64" ] && tar -czf AxeCast-Studio-macOS-arm64.tar.gz -C AxeCast-Studio-macOS-arm64 . || true
          [ -d "AxeCast-Studio-Linux-x64" ] && tar -czf AxeCast-Studio-Linux-x64.tar.gz -C AxeCast-Studio-Linux-x64 . || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "AxeCast Studio v1.0.0"
          body: |
            ## 🪓 AxeCast Studio v1.0.0

            ### 📥 Downloads

            | Platform | File | How to Use |
            |----------|------|------------|
            | 🪟 **Windows** (x64) | `AxeCast-Studio-Windows-x64.zip` | Extract and run `AxeCast-Studio.exe` |
            | 🍎 **macOS** (ARM64) | `AxeCast-Studio-macOS-arm64.tar.gz` | Extract and open `AxeCast-Studio.app` |
            | 🐧 **Linux** (x64) | `AxeCast-Studio-Linux-x64.tar.gz` | Extract and run `./run.sh` |
            | 📲 **Android APK** | `axecast_stream.apk` | Companion app for wireless streaming |

            ### 🌟 Key Features
            - **60 FPS Hardware-Accelerated Mirroring** with multi-device controls
            - **AxeSQL Studio 🪓** native SQLite database manager
            - **Live Performance Dashboard** (CPU, GPU, RAM rolling Canvas charts)
            - **Simultaneous Multi-Drawer Panels** (File Explorer + Performance Graphs)
            - **Android Emulator Auto-Discovery** (LDPlayer, BlueStacks, Nox, MEmu, WSA)
            - **Smart GitHub Auto-Update Checker**
            - **Compiled Native Binaries** with hidden source code and zero console popups

          files: |
            artifacts/AxeCast-Studio-Windows-x64.zip
            artifacts/AxeCast-Studio-macOS-arm64.tar.gz
            artifacts/AxeCast-Studio-Linux-x64.tar.gz
            axecast_stream.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
