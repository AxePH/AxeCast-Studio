plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.axecast.stream"
    compileSdk 35

    defaultConfig {
        applicationId "com.axecast.stream"
        minSdk 24
        targetSdk 35
        versionCode 102
        versionName "1.0.2"
        
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { instr ->
                localProperties.load(instr)
            }
        }
        def serverUrl = localProperties.getProperty('AXECAST_SERVER_URL', 'ws://localhost:9820')
        buildConfigField "String", "SERVER_URL", "\"${serverUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'io.getstream:stream-webrtc-android:1.3.1'
}
